<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opek SMS CRM</title>
    <link rel="stylesheet" href="/styles.css?v=20260916-simple1" />
  </head>
  <body>
    <div id="auth-root" hidden></div>
    <div class="crm" id="crm-app" hidden>
      <button
        type="button"
        class="sidebar-backdrop"
        id="sidebar-backdrop"
        aria-label="Close navigation"
        tabindex="-1"
      ></button>

      <aside class="sidebar" id="sidebar" aria-label="CRM navigation">
        <div class="sidebar-brand">
          <div>
            <span class="logo">Opek</span>
            <span class="logo-sub">SMS CRM</span>
          </div>
          <div class="sidebar-brand-actions">
            <span class="platform-badge">Platform</span>
            <button type="button" class="sidebar-close" id="sidebar-close" aria-label="Close navigation">×</button>
          </div>
        </div>

        <div class="clerk-org-switcher" id="clerk-organization-switcher"></div>

        <label class="workspace-switcher" for="tenant-select">
          <span>Business account</span>
          <select id="tenant-select" aria-label="Business account">
            <option value="opek">Opek Junk Removal</option>
          </select>
          <i aria-hidden="true">⌄</i>
        </label>

        <button type="button" id="add-business" class="btn ghost" style="margin:0 12px 16px" hidden>Add business</button>

        <nav class="nav" id="nav">
          <section>
            <p class="nav-label">Workspace</p>
            <button type="button" class="nav-item active" data-view="overview">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              <span>Dashboard</span>
            </button>
            <button type="button" class="nav-item" data-view="contacts">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 20c.6-4 2.5-6 5.5-6s4.9 2 5.5 6"/><path d="M17 8h4M19 6v4"/></svg>
              <span>Contacts</span>
            </button>
          </section>

          <section>
            <p class="nav-label">Conversations</p>
            <button type="button" class="nav-item" data-view="messaging">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5Z"/><path d="M8 10h8M8 13h5"/></svg>
              <span>Messaging</span>
              <i class="nav-tag">Live</i>
            </button>
            <button type="button" class="nav-item" data-view="call">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 3.8 10 8.5 7.8 11c1.2 2.5 2.9 4.2 5.4 5.4l2.5-2.2 4.5 2.8c.4.2.5.7.3 1.1-.8 1.7-2.4 2.9-4.3 2.8C9.5 20.5 3.5 14.5 3 7.8c-.1-1.9 1.1-3.5 2.8-4.3.5-.2 1 0 1.4.3Z"/></svg>
              <span>Inbound calls</span>
            </button>
            <button type="button" class="nav-item" data-view="messages">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
              <span>Message history</span>
            </button>
          </section>

          <section>
            <p class="nav-label">Operations</p>
            <button type="button" class="nav-item" data-view="deliverability">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/></svg>
              <span>Delivery report</span>
            </button>
            <button type="button" class="nav-item" data-view="optouts">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 8.5 7 7"/></svg>
              <span>Opt-Outs</span>
            </button>
            <button type="button" class="nav-item" data-view="automations" id="nav-automations-root">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="4"/><path d="m5.6 5.6 2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>
              <span>Automations</span>
            </button>
            <div class="nav-sub" id="nav-automations" hidden></div>
          </section>
        </nav>

        <div class="sidebar-foot">
          <div class="auth-foot">
            <span class="user-avatar" id="tenant-avatar" aria-hidden="true">OP</span>
            <div>
              <strong id="auth-email">Opek account</strong>
              <span id="store-meta">Tracking outbound SMS</span>
            </div>
            <button type="button" class="sign-out" id="sign-out-btn" title="Sign out" aria-label="Sign out">↗</button>
          </div>
        </div>
      </aside>

      <div class="workspace">
        <aside id="demo-banner" class="demo-banner" role="status" hidden>Demo preview · Sample data only · Authentication on standby · SMS, calls, and changes disabled</aside>
        <header class="toolbar">
          <button type="button" class="sidebar-trigger" id="sidebar-trigger" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
            <span class="sidebar-trigger-icon" aria-hidden="true"><b></b><b></b><b></b></span>
            <span class="sidebar-trigger-label">Menu</span>
          </button>
          <div class="toolbar-crumb">
            <span id="toolbar-tenant">Opek</span>
            <strong id="toolbar-section">Overview</strong>
          </div>
          <div class="toolbar-live">
            <span id="live-pill" class="live-pill offline" title="Realtime connection">Connecting…</span>
          </div>
        </header>

        <section class="page-heading">
          <div class="page-heading-copy">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-sub" class="muted">Your messages, contacts, and follow-ups in one place.</p>
          </div>
          <div class="toolbar-actions">
            <div class="search-wrap">
              <input
                id="search"
                type="search"
                placeholder="Search…"
                aria-label="Search current view"
                autocomplete="off"
              />
            </div>
            <select id="status-filter" aria-label="Deliverability filter">
              <option value="">All statuses</option>
              <option value="queued">Queued</option>
              <option value="submitting">Submitting</option>
              <option value="accepted">Accepted</option>
              <option value="sending">Sending</option>
              <option value="sent">Sent</option>
              <option value="delivered">Delivered</option>
              <option value="undelivered">Undelivered</option>
              <option value="failed">Failed</option>
              <option value="cancelled">Cancelled</option>
              <option value="submission_unknown">Needs review</option>
            </select>
            <button type="button" id="refresh" class="btn">Refresh</button>
          </div>
        </section>

        <section id="kpi" class="kpi-row" aria-live="polite"></section>

        <section class="main-panel">
          <div id="view-root"></div>
          <div class="pager" id="pager" hidden>
            <button type="button" id="prev-page" class="btn ghost">Previous</button>
            <span id="page-info" class="muted"></span>
            <button type="button" id="next-page" class="btn ghost">Next</button>
            <select id="page-size" aria-label="Rows per page">
              <option value="50">50 / page</option>
              <option value="100">100 / page</option>
              <option value="250">250 / page</option>
            </select>
          </div>
        </section>
      </div>

      <button
        type="button"
        class="drawer-backdrop"
        id="drawer-backdrop"
        aria-label="Close details"
        tabindex="-1"
        hidden
      ></button>
      <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
        <div class="drawer-head">
          <h2 id="drawer-title">Details</h2>
          <button type="button" id="drawer-close" class="btn ghost">Close</button>
        </div>
        <div id="drawer-body" class="drawer-body"></div>
      </aside>
    </div>

    <script src="/config.js"></script>
    <script src="/app.js?v=20260918-workers1" type="module"></script>
  </body>
</html>
