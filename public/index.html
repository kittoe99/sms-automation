<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opek SMS CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="crm">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="logo">Opek</span>
          <span class="logo-sub">SMS CRM</span>
          <span id="live-pill" class="live-pill offline" title="Realtime connection">Connecting…</span>
        </div>

        <nav class="nav" id="nav">
          <button type="button" class="nav-item active" data-view="overview">Overview</button>
          <button type="button" class="nav-item" data-view="messaging">Messaging</button>
          <button type="button" class="nav-item" data-view="messages">Messages</button>
          <button type="button" class="nav-item" data-view="contacts">Contacts</button>
          <button type="button" class="nav-item" data-view="optouts">Opt-Outs</button>
          <button type="button" class="nav-item" data-view="deliverability">Deliverability</button>
          <button type="button" class="nav-item" data-view="automations" id="nav-automations-root">
            Automations
          </button>
          <div class="nav-sub" id="nav-automations" hidden></div>
        </nav>

        <div class="sidebar-foot">
          <span id="store-meta">Tracking outbound SMS at scale</span>
        </div>
      </aside>

      <div class="workspace">
        <header class="toolbar">
          <div>
            <h1 id="page-title">Overview</h1>
            <p id="page-sub" class="muted">Pipeline health across all SMS traffic</p>
          </div>
          <div class="toolbar-actions">
            <div class="search-wrap">
              <input
                id="search"
                type="search"
                placeholder="Search phone, body, SID…"
                autocomplete="off"
              />
            </div>
            <select id="status-filter" aria-label="Deliverability filter">
              <option value="">All statuses</option>
              <option value="queued">Queued</option>
              <option value="sending">Sending</option>
              <option value="sent">Sent</option>
              <option value="delivered">Delivered</option>
              <option value="undelivered">Undelivered</option>
              <option value="failed">Failed</option>
            </select>
            <button type="button" id="refresh" class="btn">Refresh</button>
          </div>
        </header>

        <section id="kpi" class="kpi-row" aria-live="polite"></section>

        <section class="main-panel">
          <div id="view-root"></div>
          <div class="pager" id="pager" hidden>
            <button type="button" id="prev-page" class="btn ghost">Previous</button>
            <span id="page-info" class="muted"></span>
            <button type="button" id="next-page" class="btn ghost">Next</button>
            <select id="page-size" aria-label="Rows per page">
              <option value="50">50 / page</option>
              <option value="100">100 / page</option>
              <option value="250">250 / page</option>
            </select>
          </div>
        </section>
      </div>

      <aside class="drawer" id="drawer" hidden>
        <div class="drawer-head">
          <h2 id="drawer-title">Details</h2>
          <button type="button" id="drawer-close" class="btn ghost">Close</button>
        </div>
        <div id="drawer-body" class="drawer-body"></div>
      </aside>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
