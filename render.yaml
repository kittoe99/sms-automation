services:
  - type: web
    name: e2-crm-mcp
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm run start:mcp
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_RESOURCE_URL
        sync: false
      - key: CRM_CLERK_ISSUER
        value: https://clerk.crm.e2local.com
      - key: E2_CLERK_ISSUER
        value: https://clerk.e2local.com
      - key: CRM_CLERK_SECRET_KEY
        sync: false
      - key: MCP_DATABASE_URL
        sync: false
      - key: MCP_HOSTING_ADAPTER_URL
        value: https://www.e2local.com/api/web-hosting/mcp
      - key: MCP_KNOWLEDGE_ADAPTER_URL
        value: https://wxamwhfmelxqahkdtcci.supabase.co/functions/v1/crm-api/mcp/knowledge-upload
      - key: MCP_ALLOWED_ORIGINS
        value: https://crm.e2local.com
  - type: web
    name: wpacquisition-crm
    runtime: static
    buildCommand: npm ci && npm run build:frontend
    staticPublishPath: ./dist
    envVars:
      - key: CRM_API_BASE
        value: https://wxamwhfmelxqahkdtcci.supabase.co/functions/v1/crm-api
      - key: SUPABASE_URL
        value: https://wxamwhfmelxqahkdtcci.supabase.co
      - key: HOSTING_API_BASE
        value: https://www.e2local.com/api/web-hosting
      - key: PUBLIC_FORM_BASE_URL
        value: https://crm.e2local.com
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: redirect
        source: /*
        destination: /
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    # BEGIN GENERATED SECURITY HEADERS (npm run headers:generate)
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-LicstXC6JDmVTFFNkVw+a/ji8qMUDauLYei7Njr0lho=' https://clerk.crm.e2local.com https://challenges.cloudflare.com https://*.protect.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.clerk.com; font-src 'self'; connect-src 'self' https://wxamwhfmelxqahkdtcci.supabase.co wss://wxamwhfmelxqahkdtcci.supabase.co https://www.e2local.com https://clerk.crm.e2local.com https://*.protect.clerk.com:* https://clerk-telemetry.com https://*.clerk-telemetry.com https://*.r2.cloudflarestorage.com https://*.twilio.com; media-src 'self' blob: https://wxamwhfmelxqahkdtcci.supabase.co; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com https://*.protect.clerk.com https://inquiry.withpersona.com https://*.twilio.com; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests"
