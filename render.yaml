services:
  - type: web
    name: wpacquisition-crm
    runtime: static
    buildCommand: npm ci && npm run build:frontend
    staticPublishPath: ./dist
    envVars:
      - key: CRM_API_BASE
        value: https://wxamwhfmelxqahkdtcci.supabase.co/functions/v1/crm-api
      - key: SUPABASE_URL
        value: https://wxamwhfmelxqahkdtcci.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
  - type: worker
    name: wpacquisition-automation
    runtime: node
    plan: standard
    numInstances: 3
    buildCommand: npm ci
    startCommand: npm run worker:automation
    maxShutdownDelaySeconds: 120
    envVars: &worker-env
      - key: WORKER_DATABASE_URL
        sync: false
      - key: WORKER_DB_POOL_SIZE
        value: "12"
  - type: worker
    name: wpacquisition-sms
    runtime: node
    plan: standard
    numInstances: 5
    buildCommand: npm ci
    startCommand: npm run worker:sms
    maxShutdownDelaySeconds: 120
    envVars: *worker-env
  - type: worker
    name: wpacquisition-inbound-ai
    runtime: node
    plan: standard
    numInstances: 2
    buildCommand: npm ci
    startCommand: npm run worker:ai
    maxShutdownDelaySeconds: 120
    envVars:
      - key: WORKER_DATABASE_URL
        sync: false
      - key: WORKER_DB_POOL_SIZE
        value: "12"
      - key: OPENAI_API_KEY
        sync: false
  - type: worker
    name: wpacquisition-automation-drafts
    runtime: node
    plan: standard
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm run worker:draft
    maxShutdownDelaySeconds: 120
    envVars:
      - key: WORKER_DATABASE_URL
        sync: false
      - key: WORKER_DB_POOL_SIZE
        value: "12"
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTOMATION_DRAFT_MODEL
        value: gpt-5.4-mini-2026-03-17
  - type: worker
    name: wpacquisition-support-jobs
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm run worker:support
    maxShutdownDelaySeconds: 120
    envVars: *worker-env
