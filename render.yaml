services:
  - type: web
    name: wpacquisition-crm
    runtime: static
    buildCommand: npm ci && npm run build:frontend
    staticPublishPath: ./dist
    envVars:
      - key: CRM_API_BASE
        value: https://wxamwhfmelxqahkdtcci.supabase.co/functions/v1/crm-api
      - key: SUPABASE_URL
        value: https://wxamwhfmelxqahkdtcci.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: FORMS_API_BASE
        fromService:
          type: web
          name: wpacquisition-forms
          envVarKey: FORMS_PUBLIC_BASE_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
  - type: web
    name: wpacquisition-forms
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:forms
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORMS_PUBLIC_BASE_URL
        sync: false
      - key: FORMS_DATABASE_URL
        sync: false
      - key: FORMS_SIGNING_SECRET
        generateValue: true
      - key: CLERK_ISSUER
        sync: false
      - key: CRM_ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FORM_BUILDER_MODEL
        value: gpt-6-astra
      - key: FORMS_TURNSTILE_SITE_KEY
        sync: false
      - key: FORMS_TURNSTILE_SECRET
        sync: false
